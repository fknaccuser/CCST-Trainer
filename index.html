 c:[{t:"Physical access commonly defeats logical controls — console access, resets, tapping",ok:1,w:"Someone at the console can bypass passwords via recovery procedures."},{t:"It only matters for fire code",w:"Safety matters, but the security exposure is real and separate."},{t:"It has no security relevance if passwords are strong",w:"Password recovery procedures exist on virtually all network hardware."},{t:"Only data centers need it",w:"A closet switch is just as reachable a target."}],
 e:"An attacker at the console can perform password recovery, factory reset, mirror a port, or simply walk out with the hardware. Locked racks and controlled closet access are foundational — logical hardening assumes physical control."},
{d:"SEC", s:"Deciding how to handle an unpatched device on a customer network.", q:"Why does patching matter for network security?",
 c:[{t:"Patches close known vulnerabilities that are actively exploited",ok:1,w:"Published vulnerabilities become attack tooling quickly."},{t:"Patches only add features",w:"Security fixes are a primary purpose of patching."},{t:"Patching is only needed after a breach",w:"That's reactive — the vulnerability window is exactly what attackers use."},{t:"Firmware never contains vulnerabilities",w:"Network device firmware is a frequent target."}],
 e:"Once a vulnerability is published, exploit code typically follows fast. Unpatched routers, switches, and APs are common footholds precisely because they're often forgotten in patch cycles while servers get attention."},
{d:"SEC", s:"A flood of traffic overwhelms a customer's connection and legitimate users can't get through.", q:"What kind of attack is this?",
 c:[{t:"DoS / DDoS",ok:1,w:"Resource exhaustion denying service to legitimate users."},{t:"Phishing",w:"Credential theft through deception."},{t:"MAC spoofing",w:"Impersonating a device's hardware address."},{t:"SQL injection",w:"An application-layer database attack."}],
 e:"DoS comes from one source, DDoS from many coordinated ones. The goal isn't data theft but unavailability — attacking the 'A' in the CIA triad. Mitigation usually happens upstream at the provider, not on customer equipment."}
];

const CATS = [
 {id:"WIN", label:"WINDOWS"}, {id:"NIX", label:"LINUX/MAC"},
 {id:"SHOW", label:"IOS SHOW"}, {id:"CONF", label:"IOS CONFIG"}, {id:"PROTO", label:"PROTOCOLS"},
 {id:"MEDIA", label:"MEDIA/CABLE"}, {id:"OSI", label:"OSI MODEL"},
 {id:"HW", label:"HARDWARE"}, {id:"SECT", label:"SECURITY"}
];
const CATNAME = Object.fromEntries(CATS.map(c=>[c.id,c.label]));

// Six official CCST 100-150 domains (Cisco publishes no numeric weights)
const DOMS = [
 {id:"STD",   label:"STANDARDS"},
 {id:"ADDR",  label:"ADDRESSING"},
 {id:"ENDP",  label:"ENDPOINTS"},
 {id:"INFRA", label:"INFRASTRUCTURE"},
 {id:"DIAG",  label:"DIAGNOSING"},
 {id:"SEC",   label:"SECURITY"}
];
const DOMNAME = Object.fromEntries(DOMS.map(d=>[d.id,d.label]));

// ---------------- STATE ----------------
let mode = "quiz";                  // quiz | study | type | list
let sel = new Set(CATS.map(c=>c.id));
let selDom = new Set(DOMS.map(d=>d.id));
let deck = [], idx = 0, flipped = false, dirNameFirst = false;
let got = 0, miss = 0, missedSet = new Set();
let typedChecked = false, typedRight = false;
let qDeck = [], qIdx = 0, qOrder = [], qPick = null, qDone = false;
let qGot = 0, qMiss = 0, qMissed = [], qByDom = {};

const $ = id => document.getElementById(id);
const stage = $("stage");
const norm = s => String(s||"").toLowerCase().trim()
  .replace(/[.,;:!]+$/,"").replace(/\s+/g," ");
const shuffle = a => { a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

function pool(){
  let p = ITEMS.filter(it=>sel.has(it.cat));
  if(mode==="type") p = p.filter(it=>it.a);
  return p;
}
function rebuildDeck(){
  deck = shuffle(pool()); idx = 0; flipped = false;
  got = 0; miss = 0; missedSet = new Set(); typedChecked = false;
  render();
}

// ---------------- RENDER ----------------
function chipsRender(){
  if(mode==="quiz"){
    $("chips").innerHTML = DOMS.map(d=>
      `<button class="chip ${selDom.has(d.id)?"on":""}" data-dom="${d.id}">${d.label}</button>`).join("");
    document.querySelectorAll(".chip").forEach(ch=>{
      ch.onclick = ()=>{ const d=ch.dataset.dom; selDom.has(d)?selDom.delete(d):selDom.add(d);
        if(selDom.size===0) selDom.add(d); chipsRender(); rebuildQuiz(); };
    });
    return;
  }
  $("chips").innerHTML = CATS.map(c=>
    `<button class="chip ${sel.has(c.id)?"on":""}" data-cat="${c.id}">${c.label}</button>`).join("");
  document.querySelectorAll(".chip").forEach(ch=>{
    ch.onclick = ()=>{ const c=ch.dataset.cat; sel.has(c)?sel.delete(c):sel.add(c);
      if(sel.size===0) sel.add(c); chipsRender(); rebuildDeck(); };
  });
}

function rebuildQuiz(){
  qDeck = shuffle(QUESTIONS.filter(q=>selDom.has(q.d)));
  qIdx=0; qPick=null; qDone=false; qGot=0; qMiss=0; qMissed=[]; qByDom={};
  DOMS.forEach(d=>{ qByDom[d.id]={a:0,c:0}; });
  renderQuiz();
}

function quizSummary(){
  const total = qGot+qMiss, pct = total? Math.round(100*qGot/total):0;
  const rows = DOMS.filter(d=>selDom.has(d.id) && qByDom[d.id].a>0).map(d=>{
    const s=qByDom[d.id], p=Math.round(100*s.c/s.a);
    const col = p>=80?"var(--green)":p>=60?"var(--amber)":"var(--red)";
    return `<tr><td>${d.label}</td><td style="color:${col};font-family:ui-monospace,monospace;font-weight:700">${s.c}/${s.a} · ${p}%</td></tr>`;
  }).join("");
  return `<div class="summary">
    <div class="cat-tag">SHIFT REPORT</div>
    <div class="big">${qGot}/${total} · ${pct}%</div>
    <div class="fnline">${qMiss? qMiss+" ticket"+(qMiss>1?"s":"")+" closed with faults." : "Clean sweep."}</div>
    </div>
    <table style="margin-top:12px"><tr><th>DOMAIN</th><th>SCORE</th></tr>${rows}</table>
    <div class="btnrow">
      ${qMiss? `<button class="btn next" id="qredrill">REDRILL MISSED ▸</button>`:""}
      <button class="btn ghost" id="qrestart">FULL RESHUFFLE</button>
    </div>`;
}

function renderQuiz(){
  if(qDeck.length===0){ stage.innerHTML="<div class='note'>Select at least one domain.</div>"; return; }
  if(qIdx>=qDeck.length){
    stage.innerHTML = quizSummary();
    const rd=$("qredrill"); if(rd) rd.onclick=()=>{ const m=qMissed.slice();
      qDeck=shuffle(m); qIdx=0; qPick=null; qDone=false; qGot=0; qMiss=0; qMissed=[];
      DOMS.forEach(d=>{ qByDom[d.id]={a:0,c:0}; }); renderQuiz(); };
    const rs=$("qrestart"); if(rs) rs.onclick=rebuildQuiz;
    return;
  }
  const q = qDeck[qIdx];
  if(!qDone && qOrder.length!==q.c.length) qOrder = shuffle(q.c.map((_,i)=>i));
  const opts = qOrder.map(i=>{
    const c=q.c[i];
    let style=`border-color:var(--line)`;
    if(qDone){
      if(c.ok) style=`border-color:var(--green);background:rgba(46,229,138,.08)`;
      else if(qPick===i) style=`border-color:var(--red);background:rgba(255,77,94,.08)`;
    }
    return `<button class="opt" data-i="${i}" style="${style}">
      ${qDone?`<span style="color:${c.ok?"var(--green)":"var(--red)"};font-weight:800">${c.ok?"✓":"✗"}</span> `:""}
      ${esc(c.t)}${qDone&&qPick===i?`<span style="color:var(--ink-soft);font-weight:700"> ← your pick</span>`:""}
      ${qDone?`<div style="font-size:11.5px;color:var(--ink-soft);margin-top:4px;line-height:1.45">${esc(c.w)}</div>`:""}
    </button>`;
  }).join("");
  const right = qDone && qPick!=null && q.c[qPick].ok;
  stage.innerHTML = `
    <div class="card" style="cursor:default;min-height:auto">
      <div class="cat-tag">${DOMNAME[q.d]} · ${qIdx+1}/${qDeck.length}</div>
      <div style="font-size:12.5px;color:var(--ink-soft);font-style:italic;margin-bottom:8px">${esc(q.s)}</div>
      <div class="main" style="font-size:15.5px;margin-bottom:12px">${esc(q.q)}</div>
      <div class="opts">${opts}</div>
      ${qDone?`<div class="verdict ${right?"ok":"no"}">${right?"✓ CLEARED":"✗ FAULT FOUND"}</div>
        <div class="fnline" style="color:var(--ink)">${esc(q.e)}</div>`:""}
    </div>
    ${qDone?`<div class="btnrow"><button class="btn next" id="qnext">NEXT TICKET ▸</button></div>`:""}
    <div class="statline"><span>LEFT ${qDeck.length-qIdx}</span><span style="color:var(--green)">GOT ${qGot}</span><span style="color:var(--red)">MISSED ${qMiss}</span></div>`;
  if(!qDone){
    document.querySelectorAll(".opt").forEach(b=>{
      b.onclick = ()=>{
        qPick = parseInt(b.dataset.i,10); qDone = true;
        const ok = q.c[qPick].ok;
        qByDom[q.d].a++; if(ok) qByDom[q.d].c++;
        if(ok) qGot++; else { qMiss++; qMissed.push(q); }
        renderQuiz();
      };
    });
  } else {
    $("qnext").onclick = ()=>{ qIdx++; qPick=null; qDone=false; qOrder=[]; renderQuiz(); };
  }
}

function statHTML(){
  return `<div class="statline"><span>LEFT ${deck.length-idx}</span><span style="color:var(--green)">GOT ${got}</span><span style="color:var(--red)">MISSED ${miss}</span></div>`;
}

function summaryHTML(){
  const total = got + miss;
  const pct = total? Math.round(100*got/total) : 0;
  const redo = missedSet.size;
  return `<div class="summary">
    <div class="cat-tag">DECK CLEARED</div>
    <div class="big">${got}/${total} · ${pct}%</div>
    <div class="fnline">${redo? redo+" item"+(redo>1?"s":"")+" still misfiring." : "Clean sweep."}</div>
    <div class="btnrow">
      ${redo? `<button class="btn next" id="redrill">REDRILL MISSED ▸</button>`:""}
      <button class="btn ghost" id="restart">FULL RESHUFFLE</button>
    </div></div>`;
}
function bindSummary(){
  const rd = $("redrill"); if(rd) rd.onclick = ()=>{ deck = shuffle(ITEMS.filter(it=>missedSet.has(it.n) && (mode!=="type"||it.a)));
    idx=0; got=0; miss=0; missedSet=new Set(); flipped=false; typedChecked=false; render(); };
  const rs = $("restart"); if(rs) rs.onclick = rebuildDeck;
}

function renderStudy(){
  if(idx>=deck.length){ stage.innerHTML = summaryHTML(); bindSummary(); return; }
  const it = deck[idx];
  const front = dirNameFirst
    ? `<div class="main mono">${esc(it.n)}</div>`
    : `<div class="main">${esc(it.f)}</div>`;
  const back = dirNameFirst
    ? `<div class="main">${esc(it.f)}</div>${it.port?`<span class="port">${it.port}</span>`:""}`
    : `<div class="main mono">${esc(it.n)}</div>${it.port?`<span class="port">${it.port}</span>`:""}`;
  stage.innerHTML = `
    <button class="dirtoggle" id="dir">${dirNameFirst?"NAME → FUNCTION":"FUNCTION → NAME"} ⇄</button>
    <div class="card" id="card">
      <div class="cat-tag">${CATNAME[it.cat]} · ${idx+1}/${deck.length}</div>
      ${flipped?back:front}
      <div class="hintline">${flipped?"Grade yourself below.":"Tap to flip."}</div>
    </div>
    <div class="btnrow">
      <button class="btn miss" id="b-miss" ${flipped?"":"disabled"}>✗ MISSED</button>
      <button class="btn got" id="b-got" ${flipped?"":"disabled"}>✓ GOT IT</button>
    </div>${statHTML()}`;
  $("card").onclick = ()=>{ flipped=!flipped; renderStudy(); };
  $("dir").onclick = (e)=>{ e.stopPropagation(); dirNameFirst=!dirNameFirst; flipped=false; renderStudy(); };
  $("b-got").onclick = ()=>{ got++; idx++; flipped=false; renderStudy(); };
  $("b-miss").onclick = ()=>{ miss++; missedSet.add(deck[idx].n);
    deck.splice(Math.min(idx+4, deck.length), 0, deck[idx]); idx++; flipped=false; renderStudy(); };
}

function renderType(){
  if(idx>=deck.length){ stage.innerHTML = summaryHTML(); bindSummary(); return; }
  const it = deck[idx];
  stage.innerHTML = `
    <div class="card" style="cursor:default">
      <div class="cat-tag">${CATNAME[it.cat]} · ${idx+1}/${deck.length}</div>
      <div class="main">${esc(it.f)}</div>
      <div class="term"><span class="pfx">${esc(it.ctx||"$ ")}</span><input id="ti" autocomplete="off" spellcheck="false" placeholder="type the command…"></div>
      <div id="fb"></div>
    </div>
    <div class="btnrow">
      <button class="btn ghost" id="reveal">REVEAL</button>
      <button class="btn next" id="go">TRANSMIT ▸</button>
    </div>${statHTML()}`;
  const ti = $("ti"); ti.focus();
  const check = ()=>{
    if(typedChecked) { advance(); return; }
    const v = norm(ti.value); if(!v) return;
    typedRight = it.a.some(x=>norm(x)===v);
    typedChecked = true;
    $("fb").innerHTML = `<div class="verdict ${typedRight?"ok":"no"}">${typedRight?"✓ CLEARED":"✗ FAULT FOUND"}</div>
      <div class="accepted">accepted: ${it.a.map(esc).join("  ·  ")}</div>`;
    $("go").textContent = "NEXT ▸";
    if(typedRight){ got++; } else { miss++; missedSet.add(it.n);
      deck.splice(Math.min(idx+4, deck.length), 0, it); }
  };
  const advance = ()=>{ idx++; typedChecked=false; renderType(); };
  $("go").onclick = check;
  ti.onkeydown = e=>{ if(e.key==="Enter") check(); };
  $("reveal").onclick = ()=>{
    if(typedChecked) return;
    typedChecked = true; miss++; missedSet.add(it.n);
    deck.splice(Math.min(idx+4, deck.length), 0, it);
    $("fb").innerHTML = `<div class="verdict no">REVEALED — counts as a miss</div>
      <div class="accepted">accepted: ${it.a.map(esc).join("  ·  ")}</div>`;
    $("go").textContent = "NEXT ▸";
  };
}

function render(){
  if(mode==="quiz") renderQuiz();
  else if(mode==="study") renderStudy();
  else renderType();
}

// ---------------- REFERENCE DRAWER ----------------
let refSel = new Set(CATS.map(c=>c.id));
let refQ = "";

function hl(text, q){
  const t = esc(text);
  if(!q) return t;
  const i = t.toLowerCase().indexOf(q.toLowerCase());
  if(i<0) return t;
  return t.slice(0,i)+'<span class="refhit">'+t.slice(i,i+q.length)+'</span>'+t.slice(i+q.length);
}

function refChipsRender(){
  $("refchips").innerHTML = CATS.map(c=>
    `<button class="chip ${refSel.has(c.id)?"on":""}" data-rc="${c.id}">${c.label}</button>`).join("")
    + `<button class="chip" data-rc="__all">ALL</button>`;
  document.querySelectorAll("[data-rc]").forEach(ch=>{
    ch.onclick = ()=>{ const c=ch.dataset.rc;
      if(c==="__all"){ refSel = new Set(CATS.map(x=>x.id)); }
      else { refSel.has(c)?refSel.delete(c):refSel.add(c); if(refSel.size===0) refSel.add(c); }
      refChipsRender(); renderRef(); };
  });
}

function renderRef(){
  const q = refQ.trim();
  let html = "", total = 0;
  for(const c of CATS){
    if(!refSel.has(c.id)) continue;
    let rows = ITEMS.filter(it=>it.cat===c.id);
    if(q){ const lq=q.toLowerCase();
      rows = rows.filter(it=> it.n.toLowerCase().includes(lq)
        || it.f.toLowerCase().includes(lq)
        || (it.port||"").toLowerCase().includes(lq)); }
    if(rows.length===0) continue;
    total += rows.length;
    const isP = c.id==="PROTO";
    html += `<div class="grouphead">${c.label} · ${rows.length}</div>
      <table><tr><th>${isP?"PROTOCOL":"COMMAND"}</th><th>WHAT IT DOES</th>${isP?"<th>PORT</th>":""}</tr>
      ${rows.map(it=>`<tr><td class="cmd">${hl(it.n,q)}</td><td>${hl(it.f,q)}</td>${isP?`<td class="p">${hl(it.port||"—",q)}</td>`:""}</tr>`).join("")}
      </table>`;
  }
  $("refbody").innerHTML = total? html
    : `<div class="note" style="margin-top:24px">No matches for "${esc(q)}".</div>`;
}

function openRef(){
  $("refwrap").classList.add("on");
  document.body.classList.add("locked");
  renderRef();
}
function closeRef(){
  $("refwrap").classList.remove("on");
  document.body.classList.remove("locked");
}

$("fab").onclick = openRef;
$("refclose").onclick = closeRef;
$("refsearch").oninput = e=>{ refQ = e.target.value; renderRef(); };
document.addEventListener("keydown", e=>{
  if(e.key==="Escape" && $("refwrap").classList.contains("on")) closeRef();
});
refChipsRender();

// ---------------- TABS ----------------
function setMode(m){
  mode = m;
  ["quiz","study","type"].forEach(x=> $("tab-"+x).classList.toggle("on", x===m));
  chipsRender();
  if(m==="quiz") rebuildQuiz(); else rebuildDeck();
}
$("tab-quiz").onclick = ()=>setMode("quiz");
$("tab-study").onclick = ()=>setMode("study");
$("tab-type").onclick = ()=>setMode("type");

chipsRender();
rebuildQuiz();

// Offline support — registers only over https (GitHub Pages); silently skipped on file://
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
</script>
